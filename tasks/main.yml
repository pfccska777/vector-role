---
# tasks file for vector-role
---
- name: Create Vector installation directory
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    mode: "0755"

- name: Create Vector configuration directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: "0755"

- name: Create Vector data directory
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    mode: "0755"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "{{ vector_archive }}"
    mode: "0644"

- name: Unpack Vector archive
  ansible.builtin.unarchive:
    src: "{{ vector_archive }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=2"
    creates: "{{ vector_install_dir }}/bin/vector"

- name: Create symlink to current Vector version
  ansible.builtin.file:
    src: "{{ vector_install_dir }}"
    dest: "{{ vector_current_dir }}"
    state: link
    force: true

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    mode: "0644"
  notify: Restart Vector

- name: Deploy Vector systemd service
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Vector

- name: Start and enable Vector
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
    daemon_reload: true
