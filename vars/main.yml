---
# vars file for vector-role
vector_arch: "x86_64"

vector_download_url: >-
  https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}-unknown-linux-musl.tar.gz

vector_archive: "/tmp/vector-{{ vector_version }}.tar.gz"

vector_install_dir: "/opt/vector-{{ vector_version }}"
vector_current_dir: "/opt/vector"

vector_config_path: "{{ vector_config_dir }}/vector.yaml"
